name: Build

# Checks that uv.lock matches pyproject.toml, builds the sdist and the wheel,
# checks that the wheel has the module of the reactor and nothing of the
# namespace of Pyjoyment, and installs it with Pyjoyment and imports it
# outside the checkout.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      # uv.lock has to match pyproject.toml.
      - name: Check uv.lock
        run: uv lock --check

      - name: Build sdist and wheel
        run: uv build

      # The packages Pyjo and Pyjo.Reactor are those of Pyjoyment: a wheel
      # with their __init__.py would overwrite the files of Pyjoyment.
      - name: Check wheel contents
        run: |-
          python -m zipfile -l dist/*.whl | tee wheel.txt
          grep -q 'Pyjo/Reactor/Twisted.py' wheel.txt
          if grep -E 'Pyjo/(Reactor/)?__init__\.py' wheel.txt; then exit 1; fi

      # The wheel in an environment of its own, outside the checkout, so that
      # nothing comes from it. tool.uv.sources applies only in the project,
      # so Pyjoyment comes from its Git repository explicitly.
      - name: Install and import the wheel
        shell: bash
        run: |-
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" git+https://github.com/dex4er/Pyjoyment dist/*.whl
          cd "$RUNNER_TEMP"
          venv/bin/python -c 'import Pyjo.Reactor.Twisted; print(Pyjo.Reactor.Twisted.__version__)'
